description = "DDW 10.020 midterm revision Streamlit app: sorting visualizer, Big-O/o/Θ/Ω complexity quiz, and an MRT-themed graph traversal (BFS/DFS) guide."
readme = "README.md"
requires-python = ">=3.12"
